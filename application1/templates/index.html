<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Bootstrap naviagtions</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
  </head>
  <body class="bg-dark text-white d-flex flex-column min-vh-100">
    <div class="header text-center p-2">
    <h4>
        <i class="bi bi-car-front"></i>
        Simple Parking Management System
    </h4>
    <hr>
</div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-6 col-md-4 mt-5">
                <div class="card p-3">
                    <div class="card-body">
                        <h5 class="mb-4 text-dark text-center">
                            <i class="bi bi-box-arrow-in-right text-dark"></i>
                            Admin Login</h5>
                            <form method="POST">
                                {% csrf_token %}
                                <div class="mb-4 text-left">
                                    <label class="text-dark">Username</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="mb-4 text-left">
                                    <label class="text-dark">Password</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-custom w-100">
                                    Login
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-white text-dark text-center py-2 mt-auto w-100">
          <div class="container">
            <p class="mb-0">© 2026 SPMS | All Rights Reserved</p>
          </div>
        </footer>
  </body>
</html>
