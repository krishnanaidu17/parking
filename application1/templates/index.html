<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Bootstrap naviagtions</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
  </head>
  <body class="bg-dark text-white d-flex flex-column min-vh-100">
    <div class="header text-center p-2">
    <h4>
        <i class="bi bi-car-front"></i>
        Simple Parking Management System
    </h4>
    <hr>
</div>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-6 col-md-4 mt-5">
                <div class="card p-3">
                    <div class="card-body">
                        <h5 class="mb-4 text-dark text-center">
                            <i class="bi bi-box-arrow-in-right text-dark"></i>
                            Admin Login</h5>
                            <form method="POST">
                                {% csrf_token %}
                                <div class="mb-4 text-left">
                                    <label class="text-dark">Username</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="mb-4 text-left">
                                    <label class="text-dark">MobileNumber</label>
                                    <input type="tel" name="mobilenumber" class="form-control" required>
                                </div>
                                <div class="mb-4 text-left">
                                    <label class="text-dark">Password</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-custom w-100">
                                    Login
                                </button>
                                <div class="text-center mt-2">
                                   <a href="#" class="text-decoration-none small text-primary" data-bs-toggle="modal" data-bs-target="#forgotModal">Forgot Password?</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <footer class="bg-white text-dark text-center py-2 mt-auto w-100">
          <div class="container">
            <p class="mb-0">© 2026 SPMS | All Rights Reserved</p>
          </div>
        </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
    <!-- Forgot Password Modal -->
<div class="modal fade" id="forgotModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Forgot Password</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form method="POST" action="{% url 'forgot_password' %}">
                  {% csrf_token %}
                  <div class="mb-3">
                      <label class="form-label text-dark">Enter Mobile Number</label>
                      <input type="text" name="mobilenumber" id="mobile" class="form-control" required>
                      <small id="mobileError" class="text-danger"></small>
                    </div>
                    <button type="button" class="btn btn-primary w-100" onclick="sendOTP(); return false;">
                        Get OTP
                    </button>
                </form>
            </div>
    </div>
  </div>
</div>
<!-- OTP Popup Modal -->
<div class="modal fade" id="otpModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Enter OTP</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input type="text"
               id="otpInput"
               class="form-control"
               maxlength="6"
               placeholder="Enter 6 Digit OTP">
       <small id="otpError" class="text-danger"></small>

      </div>

      <div class="modal-footer">
        <button class="btn btn-success w-100" onclick="verifyOTP()">
          Verify OTP
        </button>
      </div>

    </div>
  </div>
</div>
<!-- NEW PASSWORD MODAL -->
<div class="modal fade" id="passwordModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Create New Password</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        <input type="password"
               id="newPassword"
               class="form-control"
               placeholder="Enter New Password">

        <small id="passMsg" class="text-success"></small>
      </div>

      <div class="modal-footer">
        <button class="btn btn-primary w-100" onclick="savePassword()">
          Submit
        </button>
      </div>

    </div>
  </div>
</div>
  </body>
</html>
