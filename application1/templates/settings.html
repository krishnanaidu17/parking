<!doctype html>
{% load static %}
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <title>Bootstrap naviagtions</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <script src="{% static 'js/script.js' %}"></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    <div class="container-fluid d-flex flex-column flex-grow-1">
      <div class="row">
        <div class="col-12 p-0">
            <div class="topbar d-flex justify-content-between align-items-center">
                <div class="d-flex align-items-center">
                    <button class="btn btn-light btn-sm me-2" onclick="toggleSidebar()">
                        <i class="bi bi-list"></i>
                    </button>
                    <i class="bi bi-car-front me-2"></i>
                    <h5 class="mb-0">SPMS Panel</h5>
                </div> 
                <div>
                    <span class="mr-3">Welcome, Administrator</span>
                    <button class="btn btn-primary btn-sm">Logout</button>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-2 sidebar hide" id="sidebar">
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'category' %}">Category</a>
            <a href="{% url 'vehicle_entry' %}">Vehicle Entry</a>
            <a href="{% url 'manage' %}">Manage Vehicles</a>
            <a href="{% url 'reports' %}">Reports</a>
            <a href="{% url 'vehicle_number' %}">Search</a>
            <a href="{% url 'settings' %}">Account Setting</a>
            <a href="{% url 'index' %}">Logout</a>
        </div>
       <div class="col-12" id="mainContent">
      <div class="card mb-4">
        <div class="card-header fw-bold">
          <i class="bi bi-gear-fill"></i>
          Change Your Password
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control">
            </div>
            <div class="mb-3">
              <label class="form-label">Re Enter Password</label>
              <input type="password" class="form-control">
            </div>
            <button class="btn btn-primary w-100 rounded-pill">Change Password</button>
          </form>
        </div>
      </div>
    </div>  
    </div>
     <footer class="bg-dark text-white text-center py-2 mt-auto w-100">
          <div class="container">
            <p class="mb-0">© 2026 SPMS | All Rights Reserved</p>
          </div>
      </footer>
</body>
</html>
